services:
  mssql:
    build:
      context: .
      dockerfile: docker/mssql/Dockerfile
    env_file:
      - .env.docker.example
      - path: .env.docker
        required: false
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./docker/backups:/backups:ro
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "count=$$(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -h -1 -W -Q \"SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE name IN (N'UserDb', N'ElectronicQueueProf')\" | tr -d '[:space:]'); [ \"$$count\" = \"2\" ] || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"

  web:
    build:
      context: ./WebApplication
      dockerfile: Dockerfile
    depends_on:
      mssql:
        condition: service_healthy
      mailhog:
        condition: service_started
    env_file:
      - .env.docker.example
      - path: .env.docker
        required: false
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"

volumes:
  mssql-data:
