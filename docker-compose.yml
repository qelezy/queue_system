services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - .env.docker.example
      - path: .env.docker
        required: false
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    volumes:
      - mssql-data:/var/opt/mssql
      - ./docker/backups:/backups:ro
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  db-init:
    build:
      context: .
      dockerfile: docker/mssql/Dockerfile
    depends_on:
      mssql:
        condition: service_healthy
    env_file:
      - .env.docker.example
      - path: .env.docker
        required: false
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_HOST: mssql
      BACKUP_DIR: /backups
    volumes:
      - ./docker/backups:/backups:ro
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"

  web:
    build:
      context: ./WebApplication
      dockerfile: Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    env_file:
      - .env.docker.example
      - path: .env.docker
        required: false
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_RUNNING_IN_CONTAINER: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mssql-data:
