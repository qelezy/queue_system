<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Личный кабинет</title>

    <style>
        :root {
            --main-bg-color: #f4fafb;
            --form-bg-color: #ffffff;
            --primary-color: #00b3b8;
            --primary-hover-color: #009599;
            --primary-soft: rgba(0, 179, 184, 0.12);
            --text-color: #333333;
            --text-secondary-color: #555555;
            --input-border-color: #cccccc;
            --input-focus-color: #00b3b8;
            --sidebar-bg: #0d3d40;
            --sidebar-text: #e8f7f7;
            --sidebar-active: #00b3b8;
            --sidebar-width: 300px;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            --header-border: #e0ecec;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--main-bg-color);
            color: var(--text-color);
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            color: var(--sidebar-text);
            padding: 20px;
        }

            .sidebar h2 {
                margin-bottom: 20px;
            }

            .sidebar a {
                display: block;
                padding: 10px;
                color: var(--sidebar-text);
                text-decoration: none;
                border-radius: 6px;
                margin-bottom: 8px;
            }

                .sidebar a.active,
                .sidebar a:hover {
                    background: var(--sidebar-active);
                }

        /* CONTENT */
        .content {
            flex: 1;
            padding: 30px;
        }

        /* CARD */
        .card {
            background: var(--form-bg-color);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            max-width: 700px;
        }

            .card h1 {
                margin-top: 0;
                margin-bottom: 20px;
                font-size: 22px;
            }

        /* FORM */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

            .form-field label {
                margin-bottom: 6px;
                font-size: 14px;
                color: var(--text-secondary-color);
            }

            .form-field input {
                padding: 10px;
                border: 1px solid var(--input-border-color);
                border-radius: 6px;
                outline: none;
                transition: 0.2s;
            }

                .form-field input:focus {
                    border-color: var(--input-focus-color);
                    box-shadow: 0 0 0 3px var(--primary-soft);
                }

        /* FULL WIDTH */
        .full {
            grid-column: 1 / -1;
        }

        /* BUTTON */
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

            .btn-primary:hover {
                background: var(--primary-hover-color);
            }

        .btn-secondary {
            background: #eaeaea;
        }
    </style>

</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <h2>Кабинет</h2>
            <a class="active" href="#">Профиль</a>
            <a href="#">Безопасность</a>
            <a href="#">Уведомления</a>
            <a href="#">Выход</a>
        </div>

        <!-- CONTENT -->
        <div class="content">

            <div class="card">
                <h1>Личный кабинет</h1>

                <form>

                    <div class="form-grid">

                        <div class="form-field">
                            <label>Фамилия</label>
                            <input type="text" value="Иванов">
                        </div>

                        <div class="form-field">
                            <label>Имя</label>
                            <input type="text" value="Иван">
                        </div>

                        <div class="form-field full">
                            <label>Отчество</label>
                            <input type="text" value="Иванович">
                        </div>

                        <div class="form-field full">
                            <label>Email</label>
                            <input type="email" value="user@mail.com">
                        </div>

                    </div>

                    <hr class="card-divider">

                    <h3>Смена пароля</h3>

                    <div class="form-grid">

                        <div class="form-field full">
                            <label>Текущий пароль</label>
                            <input type="password">
                        </div>

                        <div class="form-field">
                            <label>Новый пароль</label>
                            <input type="password">
                        </div>

                        <div class="form-field">
                            <label>Повтор пароля</label>
                            <input type="password">
                        </div>

                    </div>

                    <div class="actions">
                        <button type="submit" class="btn-primary">Сохранить</button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
