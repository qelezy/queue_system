<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Восстановление пароля — прототип</title>
    <link rel="stylesheet" href="css/prototype.css" />
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-form-container">
            <div class="auth-form-title">Забыли пароль?</div>
            <p class="auth-form-subtitle">Укажите email — отправим ссылку для сброса пароля</p>

            <form class="auth-form" id="forgotForm" action="#" method="post">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" />
                </div>
                <button type="submit">Отправить ссылку</button>
            </form>

            <p class="auth-links">
                <a href="login.html">Вернуться ко входу</a>
            </p>
        </div>
    </div>
    <script>
        function showPrototypeToast(message) {
            var toast = document.createElement('div');
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.top = '16px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.padding = '10px 14px';
            toast.style.background = '#edf9f7';
            toast.style.color = '#11685d';
            toast.style.border = '1px solid rgba(21,133,120,.28)';
            toast.style.borderRadius = '10px';
            toast.style.boxShadow = '0 10px 28px rgba(17,104,93,.32)';
            toast.style.zIndex = '9999';
            document.body.appendChild(toast);
            window.setTimeout(function () { toast.remove(); }, 3000);
        }

        document.getElementById('forgotForm').addEventListener('submit', function (e) {
            e.preventDefault();
            showPrototypeToast('Прототип: здесь будет запрос на отправку письма со ссылкой.');
        });
    </script>
</body>
</html>
