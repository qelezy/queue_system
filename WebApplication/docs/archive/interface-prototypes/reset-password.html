<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сброс пароля — прототип</title>
    <link rel="stylesheet" href="css/prototype.css" />
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-form-container">
            <div class="auth-form-title">Сброс пароля</div>
            <p class="auth-form-subtitle">Задайте новый пароль для учётной записи</p>

            <form class="auth-form" id="resetForm" action="#" method="post">
                <div class="form-field">
                    <label for="newPassword">Новый пароль</label>
                    <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password" minlength="8" />
                </div>
                <div class="form-field">
                    <label for="confirmPassword">Подтверждение пароля</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" minlength="8" />
                </div>
                <button type="submit">Сбросить пароль</button>
            </form>
        </div>
    </div>
    <script>
        function showPrototypeToast(message, isError) {
            var toast = document.createElement('div');
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.top = '16px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.padding = '10px 14px';
            toast.style.background = isError ? '#fff3f3' : '#edf9f7';
            toast.style.color = isError ? '#9e2c2c' : '#11685d';
            toast.style.border = isError ? '1px solid rgba(192,71,71,.28)' : '1px solid rgba(21,133,120,.28)';
            toast.style.borderRadius = '10px';
            toast.style.boxShadow = isError ? '0 10px 28px rgba(158,44,44,.30)' : '0 10px 28px rgba(17,104,93,.32)';
            toast.style.zIndex = '9999';
            document.body.appendChild(toast);
            window.setTimeout(function () { toast.remove(); }, 3000);
        }

        document.getElementById('resetForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var a = document.getElementById('newPassword').value;
            var b = document.getElementById('confirmPassword').value;
            if (a !== b) {
                showPrototypeToast('Пароли не совпадают.', true);
                return;
            }
            showPrototypeToast('Прототип: здесь будет POST с userId, token и новым паролем.', false);
        });
    </script>
</body>
</html>
