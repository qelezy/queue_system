<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход — прототип</title>
    <link rel="stylesheet" href="css/prototype.css" />
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-form-container">
            <div class="auth-form-title">Вход</div>
            <p class="auth-form-subtitle">Введите учётные данные для доступа к системе</p>

            <form class="auth-form" id="loginForm" action="#" method="post">
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="username" />
                </div>
                <div class="form-field">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" />
                </div>
                <div class="login-options-row">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe" />
                        <label for="rememberMe">Запомнить меня</label>
                    </div>
                    <a class="forgot-inline" href="forgot-password.html">Забыли пароль?</a>
                </div>
                <button type="submit">Войти</button>
            </form>
        </div>
    </div>
    <script>
        function showPrototypeToast(message) {
            var toast = document.createElement('div');
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.top = '16px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.padding = '10px 14px';
            toast.style.background = '#edf9f7';
            toast.style.color = '#11685d';
            toast.style.border = '1px solid rgba(21,133,120,.28)';
            toast.style.borderRadius = '10px';
            toast.style.boxShadow = '0 10px 28px rgba(17,104,93,.32)';
            toast.style.zIndex = '9999';
            document.body.appendChild(toast);
            window.setTimeout(function () { toast.remove(); }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            showPrototypeToast('Прототип: здесь будет POST на API входа.');
        });
    </script>
</body>
</html>
